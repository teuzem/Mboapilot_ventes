<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A2540">
  <title>Connexion interrompue · MboaPilot</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F6F9FC; color:#0A2540; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; padding:24px; }
    .carte { width:min(460px,100%); background:#fff; border:1px solid #E2E6EF; border-radius:16px; padding:32px; text-align:center; box-shadow:0 8px 30px rgba(10,37,64,.06); }
    img { width:72px; height:72px; display:block; margin:0 auto 18px; }
    h1 { font-size:20px; margin:0 0 10px; }
    p { font-size:14px; line-height:1.6; color:#4C5568; margin:0 0 12px; }
    .petit { font-size:12px; color:#7B8393; }
    button { margin-top:16px; padding:11px 18px; border:0; border-radius:10px; background:#635BFF; color:#fff; font-size:14px; cursor:pointer; }
  </style>
</head>
<body>
  <main class="carte">
    <img src="/icons/icon-96.png" alt="MboaPilot">
    <h1>La connexion est interrompue</h1>
    <p>Les pages que vous avez déjà ouvertes restent disponibles. Les ventes et les indicateurs reviennent dès que le réseau est rétabli.</p>
    <p class="petit">Aucune donnée de vente n'est enregistrée pendant cette coupure.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
